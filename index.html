<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>PanHub · 全网最全的网盘搜索</title>
    <meta name="description" content="PanHub：聚合阿里云盘、夸克、百度网盘、115、迅雷等平台的全网最全网盘搜索工具，实时检索分享资源，快速、高效。" />
    <meta name="keywords" content="网盘搜索, 阿里云盘, 夸克, 百度网盘, 115, 迅雷, 资源搜索, 盘搜, panhub, 网盘聚合搜索" />
    <meta name="theme-color" content="#111111" />
    <!-- 站点图标 / PWA manifest 统一使用官方 logo（CDN SVG） -->
    <link rel="icon" type="image/svg+xml" href="icon/logo0.svg" />
    <link rel="manifest" href="./site.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <!-- 首屏即时应用系统深色模式（避免闪白） -->
    <script>
        (function() {
            try {
                if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
                    document.documentElement.classList.add("dark");
                }
            } catch (e) {}
        })();
    </script>
    <style>
        /* ===== 顶部导航栏样式 ===== */
.site-header {
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 60px;
    padding: 0 24px;
    background: #ffffff;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB",
          "Microsoft YaHei", sans-serif;
}

      /* 深色模式适配 */
.dark .site-header {
    background: #1a1a1a;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
}

.site-brand {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 18px;
    font-weight: 600;
    color: #111;
    text-decoration: none;
}

.dark .site-brand {
    color: #eee;
}

.site-brand img {
    width: 28px;
    height: 28px;
    border-radius: 50%;
}

.site-nav {
    display: flex;
    align-items: center;
    gap: 20px;
}

.site-nav a {
    font-size: 14px;
    color: #333;
    text-decoration: none;
    transition: color 0.2s;
    white-space: nowrap;
}

.dark .site-nav a {
    color: #ccc;
}

.site-nav a:hover {
    color: #1a6dff;
}

.site-login {
    font-size: 14px;
    color: #1a6dff;
    border: 1px solid #1a6dff;
    padding: 4px 14px;
    border-radius: 20px;
    text-decoration: none;
    transition: background 0.2s, color 0.2s;
}

.site-login:hover {
    background: #1a6dff;
    color: #fff;
}

      /* 移动端折叠 */
@media (max-width: 768px) {
    .site-nav {
        display: none;
    }

    .site-header {
        justify-content: center;
    }
}
    </style>
</head>

<body>
    <!-- ===== 静态顶部导航栏（可直接修改品牌文字和链接） ===== -->
    <header class="site-header">
        <!-- 品牌区域：修改文字即可 -->
        <a class="site-brand" href="/">
            <!-- 如需图标，可取消下面注释并替换 URL -->
            <!-- <img src="https://cdn.jsdmirror.com/gh/wu529778790/img.shenzjd.com@master/blog/imgx-20260828-151509-5bk7.svg" alt="logo" /> --> <span>神族九帝</span>
        </a>
        <!-- 导航链接：增删 <a> 标签即可 -->
        <nav class="site-nav"> <a href="https://shenzjd.com" target="_blank" rel="noopener">AI情报局</a>
            <a href="https://panhub.shenzjd.com" target="_blank" rel="noopener">网盘搜索</a>
            <a href="https://parse.shenzjd.com" target="_blank" rel="noopener">视频解析</a>
            <a href="#" target="_blank" rel="noopener">流量卡</a>
            <a href="https://img.shenzjd.com" target="_blank" rel="noopener">Git图床</a>
            <a href="https://navhub.shenzjd.com" target="_blank" rel="noopener">导航森林</a>
            <a href="https://freeimg.shenzjd.com" target="_blank" rel="noopener">免费生图</a>
            <a class="site-login" href="#">登录</a>
        </nav>
    </header>
    <!-- 原有的应用挂载点 -->
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
</body>

</html>
