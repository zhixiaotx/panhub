<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>PanHub · 全网最全的网盘搜索</title>
    <meta name="description" content="PanHub：聚合阿里云盘、夸克、百度网盘、115、迅雷等平台的全网最全网盘搜索工具，实时检索分享资源，快速、高效。" />
    <meta name="keywords" content="网盘搜索, 阿里云盘, 夸克, 百度网盘, 115, 迅雷, 资源搜索, 盘搜, panhub, 网盘聚合搜索" />
    <meta name="theme-color" content="#111111" />
    <link rel="icon" type="image/svg+xml" href="./icons/logo0.svg" />
    <link rel="manifest" href="./site.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <script>
        (function() {
            try {
                if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
                    document.documentElement.classList.add("dark");
                }
            } catch (e) {}
        })();
    </script>
    <style>
        /* ===== 顶部导航栏样式 ===== */
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
        }

        .site-header {
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 60px;
            padding: 0 32px;
            background: #ffffff;
            border-bottom: 1px solid #f0f0f0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB",
                "Microsoft YaHei", sans-serif;
        }

        .dark .site-header {
            background: #1a1a1a;
            border-bottom: 1px solid #2a2a2a;
        }

        /* 品牌区域 */
        .site-brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 18px;
            font-weight: 700;
            color: #111111;
            text-decoration: none;
            letter-spacing: 0.5px;
            flex-shrink: 0;
        }

        .dark .site-brand {
            color: #f0f0f0;
        }

        .site-brand img {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            object-fit: cover;
        }

        /* 右侧导航区 */
        .site-nav {
            display: flex;
            align-items: center;
            gap: 24px;
            height: 100%;
        }

        .site-nav a.nav-link {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 14px;
            color: #333333;
            text-decoration: none;
            transition: color 0.2s;
            white-space: nowrap;
        }

        .dark .site-nav a.nav-link {
            color: #cccccc;
        }

        .site-nav a.nav-link:hover {
            color: #1a6dff;
        }

        /* 图标样式 */
        .site-nav a.nav-link .nav-icon {
            font-size: 15px;
            line-height: 1;
            display: inline-block;
            transform: translateY(-1px);
        }

        /* 登录按钮 */
        .site-login {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 32px;
            padding: 0 16px;
            font-size: 14px;
            color: #1a6dff;
            background: transparent;
            border: 1px solid #1a6dff;
            border-radius: 999px;
            text-decoration: none;
            transition: background 0.2s, color 0.2s;
            white-space: nowrap;
            line-height: 1;
        }

        .site-login:hover {
            background: #1a6dff;
            color: #ffffff;
        }

        /* 移动端 */
        @media (max-width: 768px) {
            .site-header {
                padding: 0 16px;
                height: 56px;
            }

            .site-brand {
                font-size: 16px;
            }

            .site-brand img {
                width: 24px;
                height: 24px;
            }

            .site-nav {
                gap: 14px;
            }

            .site-nav a.nav-link {
                font-size: 13px;
            }

            .site-login {
                height: 28px;
                padding: 0 12px;
                font-size: 13px;
            }
        }

        /* 超小屏隐藏部分链接 */
        @media (max-width: 480px) {
            .site-nav a.nav-link {
                display: none;
            }

            .site-nav a.nav-link:first-child,
            .site-nav a.nav-link:nth-child(2) {
                display: inline-flex;
            }
        }
    </style>
</head>

<body>
    <!-- ===== 顶部导航栏 ===== -->
    <header class="site-header">
        <!-- 左侧品牌 -->
        <a class="site-brand" href="/">
            <img src="./icons/logo0.svg" alt="logo" />
            <span>Sky</span>
        </a>
        <!-- 右侧导航 -->
        <nav class="site-nav">
            <a class="nav-link" href="https://oiio-nav.pages.dev/" target="_blank" rel="noopener">
                <span class="nav-icon">🧭</span>oiio-nav
            </a>
            <a class="nav-link" href="https://psonline.rainsky.cc.cd" target="_blank" rel="noopener">
                <span class="nav-icon">🖌️</span>在线PS
            </a>
            <a class="nav-link" href="https://bing.rainsky.cc.cd" target="_blank" rel="noopener">
                <span class="nav-icon">🖼️</span>必应壁纸
            </a>
            <a class="nav-link" href="https://md.rainsky.cc.cd" target="_blank" rel="noopener">
                <span class="nav-icon">📝</span>Markdown 编辑器
            </a>
            <a class="nav-link" href="https://imgbed.stimi.cc.cd/" target="_blank" rel="noopener">
                <span class="nav-icon">🗂️</span>Git图床
            </a>
            <a class="nav-link" href="https://skyblog-dju.pages.dev/" target="_blank" rel="noopener">
                <span class="nav-icon">✍️</span>博客
            </a>
            <a class="nav-link" href="https://html2links.rainsky.cc.cd/" target="_blank" rel="noopener">
                <span class="nav-icon">🌐</span>Html渲染器
            </a>
            <a class="site-login" href="#">登录</a>
        </nav>
    </header>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
</body>

</html>
